; PlatformIO Project Configuration File

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino

monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI
    fastled/FastLED
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7
    bodmer/TJpg_Decoder

build_flags =
    ; USB serial over USB-C
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

    ; 8 MB OPI PSRAM, lets TFT_eSPI put the full-screen sprites there
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1

    ; Tell TFT_eSPI configuration is supplied here
    -DUSER_SETUP_LOADED=1

    ; LilyGO T-Display-S3 display
    -DST7789_DRIVER
    -DINIT_SEQUENCE_3
    -DCGRAM_OFFSET
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON

    -DTFT_PARALLEL_8_BIT
    -DUSE_HSPI_PORT

    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320

    ; Display control pins
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9

    ; 8-bit parallel display bus
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48

    ; Backlight
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH

    ; Fonts
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT7